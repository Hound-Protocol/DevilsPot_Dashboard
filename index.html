<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevilsPot – Dashboard</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#070304;--card:rgba(28,12,10,.55);--card2:rgba(40,16,12,.6);--line:rgba(255,110,60,.18);--tx:#fbeee6;--mut:#c4a191;--red:#ff2d1a;--org:#ff8a1f;--gold:#ffd166;--ok:#5be28a;--warn:#ffc233;--mx:50%;--my:50%}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--tx);font:15px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden}
/* ---------- HELL BACKGROUND ---------- */
.hell{position:fixed;inset:0;z-index:-3;background:
 radial-gradient(120% 70% at 50% 120%,#7a0d00 0%,#3a0500 35%,transparent 70%),
 radial-gradient(80% 60% at 15% 0%,#2a0508 0%,transparent 60%),
 radial-gradient(70% 50% at 90% 10%,#210407 0%,transparent 60%),#070304}
.lava{position:fixed;left:-10%;right:-10%;bottom:-8vh;height:55vh;z-index:-2;filter:url(#heat) blur(14px);opacity:.9;pointer-events:none}
.lava i{position:absolute;bottom:0;border-radius:50% 50% 0 0;background:radial-gradient(closest-side,rgba(255,200,60,.95),rgba(255,90,20,.8) 45%,rgba(200,20,0,.0) 100%);animation:flame 6s ease-in-out infinite alternate}
.lava i:nth-child(1){left:2%;width:34%;height:80%;animation-duration:5.2s}
.lava i:nth-child(2){left:22%;width:40%;height:100%;animation-duration:7s;animation-delay:-2s}
.lava i:nth-child(3){left:48%;width:36%;height:85%;animation-duration:6s;animation-delay:-1s}
.lava i:nth-child(4){left:68%;width:38%;height:95%;animation-duration:8s;animation-delay:-3s}
.lava i:nth-child(5){left:-6%;width:30%;height:70%;animation-duration:5.8s;animation-delay:-4s}
@keyframes flame{0%{transform:scale(1,.85) translateY(6%);opacity:.7}50%{transform:scale(1.08,1.05) translateY(-2%);opacity:1}100%{transform:scale(.95,.92) translateY(4%);opacity:.8}}
.cracks{position:fixed;inset:0;z-index:-2;opacity:.18;pointer-events:none;background:
 repeating-linear-gradient(115deg,transparent 0 120px,rgba(255,80,20,.25) 121px,transparent 123px),
 repeating-linear-gradient(65deg,transparent 0 200px,rgba(255,60,10,.18) 201px,transparent 203px);
 mask-image:linear-gradient(to top,#000,transparent 70%);-webkit-mask-image:linear-gradient(to top,#000,transparent 70%)}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;mix-blend-mode:screen}
.vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%)}
.smoke{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.35;background:
 radial-gradient(40% 30% at 20% 30%,rgba(120,20,10,.35),transparent 70%),
 radial-gradient(35% 28% at 80% 40%,rgba(160,40,10,.3),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,0,0) scale(1)}to{transform:translate3d(3%,-2%,0) scale(1.1)}}
/* ---------- HEADER ---------- */
header{padding:34px 22px 6px;max-width:1120px;margin:0 auto;text-align:center}
.logo{display:inline-flex;align-items:center;gap:14px}
.horns{font-size:46px;filter:drop-shadow(0 0 14px #ff4a1a);animation:flick 2.6s infinite}
h1{margin:0;font:700 clamp(40px,8vw,84px)/1 Oswald,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;
 background:linear-gradient(180deg,#fff3c4 0%,#ffc233 30%,#ff5a1a 62%,#b00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 18px rgba(255,80,20,.65)) drop-shadow(0 2px 0 #300);animation:flick 3.4s infinite}
h1 span{background:linear-gradient(180deg,#ff9a6a,#ff1a00 60%,#7a0000);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes flick{0%,100%{opacity:1}7%{opacity:.88}9%{opacity:1}42%{opacity:.94}44%{opacity:1}73%{opacity:.9}75%{opacity:1}}
.sub{color:var(--mut);margin:8px 0 14px;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
/* ---------- NAV ---------- */
nav{position:sticky;top:10px;z-index:10;margin:8px auto 0;max-width:1120px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
 background:rgba(18,6,5,.55);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 40px rgba(255,60,20,.12)}
nav button{position:relative;background:transparent;color:var(--tx);border:1px solid transparent;border-radius:11px;padding:9px 15px;cursor:pointer;font:600 14px Inter,sans-serif;transition:.25s}
nav button:hover{background:rgba(255,100,40,.12);border-color:var(--line);transform:translateY(-1px)}
nav button.on{background:linear-gradient(135deg,#ff2d1a,#ff8a1f);color:#fff;box-shadow:0 0 22px rgba(255,70,20,.65),inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(0,0,0,.4)}
/* ---------- LAYOUT ---------- */
main{max-width:1120px;margin:0 auto;padding:22px 20px 80px}
section{display:none}
section.on{display:block;animation:enter .55s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
h2{margin:8px 0 6px;font:700 clamp(26px,4vw,38px)/1.1 Oswald,sans-serif;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(90deg,#fff,#ffb36b 50%,#ff4a1a);-webkit-background-clip:text;background-clip:text;color:transparent}
h3{margin:0 0 8px;font:600 15px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--org);text-shadow:0 0 12px rgba(255,120,30,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:14px 0}
.card{position:relative;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px;overflow:hidden;
 box-shadow:0 8px 30px rgba(0,0,0,.45);transition:transform .3s,border-color .3s,box-shadow .3s;animation:rise .6s both}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,120,40,.22),transparent 70%)}
.card::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--org),var(--red),transparent);opacity:.7}
.card:hover{transform:translateY(-4px);border-color:rgba(255,120,50,.55);box-shadow:0 16px 46px rgba(0,0,0,.6),0 0 34px rgba(255,70,20,.28)}
.card:hover::before{opacity:1}
.grid .card:nth-child(1){animation-delay:.04s}.grid .card:nth-child(2){animation-delay:.12s}.grid .card:nth-child(3){animation-delay:.2s}.grid .card:nth-child(4){animation-delay:.28s}.grid .card:nth-child(5){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.card ul{margin:6px 0 0;padding-left:18px}.card li{margin:4px 0}.card li::marker{color:var(--org)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:14px 0}
.kpi div{position:relative;background:linear-gradient(160deg,rgba(60,18,10,.7),rgba(24,8,6,.6));border:1px solid var(--line);border-radius:14px;padding:14px;overflow:hidden;animation:rise .6s both}
.kpi div::after{content:"";position:absolute;right:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,90,20,.35),transparent);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35);opacity:.6}}
.kpi b{display:block;font:700 26px Oswald,sans-serif;letter-spacing:.03em;color:#fff;text-shadow:0 0 16px rgba(255,120,30,.55)}
.kpi small{color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.tag{display:inline-block;font:500 11px Inter;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-left:6px;letter-spacing:.04em;text-transform:none;text-shadow:none}
.tag.fact{color:var(--ok);border-color:rgba(91,226,138,.5);background:rgba(91,226,138,.08)}.tag.est{color:var(--warn);border-color:rgba(255,194,51,.5);background:rgba(255,194,51,.08)}
.note{background:linear-gradient(90deg,rgba(255,45,26,.18),rgba(255,45,26,.04));border:1px solid rgba(255,70,40,.35);border-left:4px solid var(--red);padding:13px 15px;border-radius:12px;margin:14px 0;color:#ffe2d6;box-shadow:0 0 28px rgba(255,45,26,.12)}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid rgba(255,110,60,.12);cursor:pointer;border-radius:8px;transition:.2s}
label.chk:hover{background:rgba(255,100,40,.08)}
label.chk input{margin-top:5px;accent-color:var(--red);width:16px;height:16px}
label.chk.done span{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--red)}
.bar{height:12px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:10px 0;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,#8a0000,#ff2d1a,#ff8a1f,#ffd166,#ff8a1f,#ff2d1a);background-size:300% 100%;animation:shim 3s linear infinite;box-shadow:0 0 18px rgba(255,90,20,.8)}
@keyframes shim{to{background-position:-300% 0}}
table{width:100%;border-collapse:collapse;margin-top:6px}
td,th{padding:7px 8px;border-bottom:1px solid rgba(255,110,60,.12);text-align:left;font-size:14px}
th{color:var(--mut);font-weight:500}
input[type=number],textarea,input[type=text]{background:rgba(10,3,3,.6);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;width:100%;transition:.25s;outline:none}
input:focus,textarea:focus{border-color:var(--org);box-shadow:0 0 0 3px rgba(255,120,30,.2),0 0 22px rgba(255,90,20,.3)}
td input[type=number]{width:130px;text-align:right}
textarea{min-height:96px;resize:vertical}
.res{font:700 22px Oswald,sans-serif;color:var(--gold);text-shadow:0 0 14px rgba(255,200,60,.4)}
.pos{color:var(--ok)!important}.neg{color:#ff5a47!important}
a{color:var(--org)}
.small{font-size:13px;color:var(--mut)}
@media(max-width:600px){nav{top:4px}.horns{font-size:34px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#fx{display:none}}
</style>
</head>

 ["Forma podnikání","est",["s.r.o.: omezené ručení firmou, ale banka u úvěru stejně často chce osobní ručení. Vhodnější pro tři společníky.","OSVČ: jednodušší, ale ručíte celým majetkem a tři lidé na jednu živnost nejdou.","Smlouva společníků je nejdůležitější dokument."]],
 ["DPH a daně","fact",["Plátcem DPH se stanete při obratu nad 2 mil. Kč za rok (od 1. 1. dalšího roku), nebo ihned nad 2 536 500 Kč.","Restaurace tohoto obratu rychle dosáhne, počítejte s DPH. Sazby u stravování ověřte s účetní.","Paušální daň je jen pro OSVČ do 2 mil. Kč a ne pro plátce DPH."]],
 ["Hygiena a provoz","fact",["Provoz kontroluje Krajská hygienická stanice. Základ: vyhláška 137/2004 Sb. o stravovacích službách a systém HACCP (kontrola hygieny při práci s jídlem).","Změna užívání prostoru a stavební řízení: ověřit na stavebním úřadu ve Zlíně."]],
 ["Další povinnosti","est",["Živnostenské oprávnění (hostinská činnost)","Evidence tržeb (EET zrušena, ověřit aktuální stav)","Požární ochrana, BOZP (bezpečnost práce), pojištění provozu","Licence na hudbu, alergeny, ceník"]]
];
const ROAD=[
 ["Fáze 1: Ověření (měsíc 1–3)",[["Vytvořit dashboard a první návrh plánu","done"],["Rozdělit role a podíly mezi tři společníky","todo"],["Ověřit ve Zlíně, že hotpot opravdu chybí","todo"],["Navštívit hotpot restaurace jinde (Brno, Praha), nafotit, změřit ceny","todo"],["Navrhnout menu a spočítat cenu surovin na porci","todo"],["Dotazník mezi studenty UTB a známými","todo"],["Založit sociální sítě a seznam zájemců","todo"]]],
 ["Fáze 2: Zkušební provoz (měsíc 3–6)",[["Najít kuchyň nebo prostor na jednorázové večery","todo"],["Uspořádat 2–4 hotpot večery","todo"],["Vyhodnotit tržby, náklady a spokojenost","todo"],["Rozhodnout: pokračovat / upravit / skončit","todo"]]],
 ["Fáze 3: Plán a financování (měsíc 5–9)",[["Dokončit podnikatelský plán a finance","todo"],["Konzultace s účetní: forma, DPH","todo"],["Schůzky s 2–3 bankami (záruka NRB / Garant InvestEU)","todo"],["Nabídky leasingu vybavení","todo"],["Podepsat smlouvu společníků","todo"]]],
 ["Fáze 4: Prostor a povolení (měsíc 8–12)",[["Vybrat lokalitu (frekvence, studenti, parkování, elektřina)","todo"],["Dohodnout nájem s volnými měsíci na rekonstrukci","todo"],["Změna užívání, hygiena, požární ochrana","todo"],["Živnostenské oprávnění / registrace firmy","todo"]]],
 ["Fáze 5: Otevření (měsíc 10–14)",[["Objednat vybavení","todo"],["Najmout a zaškolit personál, školení hygieny (HACCP)","todo"],["Kasa, rezervace, dodavatelé","todo"],["Zkušební otevření pro pozvané a recenze","todo"],["Velké otevření","todo"]]]
];
const ASK=[
 ["Co potřebuju od vás",[ "Jak si rozdělíte role (kdo vede, kdo kuchyň, kdo marketing)?","Kolik každý z vás může a chce ručit za úvěr?","Jaký prostor a čtvrť ve Zlíně preferujete (centrum, u UTB, Zlín-Malenovice)?","Chcete provoz hlavně večer a o víkendu, nebo i přes den?","Máte zkušenost s gastrem, nebo budete najímat kuchaře?"]],
 ["Co zjistím / připravím já",["Seznam konkrétních hotpot podniků v Brně a Praze s cenami","Návrh menu s kalkulací ceny surovin","Dotazník pro studenty","Seznam prostor ve Zlíně k pronájmu","Podklady pro schůzku s bankou"]]
];

/* =====================================================
   RENDER (čtecí, bez vstupů)
   ===================================================== */
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString("cs-CZ")+" Kč";
const num=n=>Math.round(n).toLocaleString("cs-CZ");
const tag=t=>t==="fact"?'<span class="tag fact">zjištěno</span>':t==="est"?'<span class="tag est">k ověření</span>':"";
const cards=a=>`<div class="grid">${a.map(([t,g,l])=>`<div class="card"><h3>${t}${tag(g)}</h3><ul>${l.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;

// finanční výpočty
const invT=INV.reduce((a,x)=>a+x[1],0), fixT=FIXED.reduce((a,x)=>a+x[1],0);
const P=invT*M.loanShare, r=M.rate/12, n=M.years*12, pay=P*r/(1-Math.pow(1+r,-n));
const scen=SCEN.map(([name,occ])=>{const g=M.seats*M.turns*occ*M.days,rev=g*M.price,gm=rev*(1-M.food);return{name,occ,g,rev,gm,profit:gm-fixT-pay}});
const be=(fixT+pay)/(M.price*(1-M.food));

const V={};
V.prehled=`<h2>Přehled</h2><div class="kpi">${KPI.map(([l,v])=>`<div><small>${l}</small><b>${v}</b></div>`).join("")}<div><small>Roadmapa</small><b id="rp"></b></div></div>
<div class="note"><b>Hlavní zjištění:</b> bez vlastního kapitálu je největší riziko ručení za půjčku. Nejdřív ověřte poptávku levným zkušebním provozem (pop-up večery), teprve potom berte velký úvěr.</div>${cards(OVERVIEW)}`;
V.plan=`<h2>Podnikový plán</h2><p class="small">První návrh. Doplňuje a upravuje Claude podle toho, co zjistíme.</p><div class="grid">${PLAN.map(([t,x])=>`<div class="card"><h3>${t}</h3><p>${x}</p></div>`).join("")}</div>`;
V.fin=`<h2>Financování bez vlastního kapitálu</h2>${cards(FIN)}<div class="note"><b>Doporučení:</b> nejdřív zkušební provoz a hotová čísla, pak banka. Banka chce plán, rozpočet, předpověď příjmů a výdajů (cash flow) a ideálně doložit poptávku.</div><div class="card"><h3>Co banka obvykle chce <span class="tag est">odhad</span></h3><ul>${BANK.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
V.calc=`<h2>Finance (modelový scénář)</h2><div class="note">Všechna čísla jsou <b>moje odhady</b>, ne zjištěná fakta. Přepočítám je, jakmile budeme mít nabídky dodavatelů a nájmů.</div>
<div class="grid"><div class="card"><h3>Startovní investice</h3><table>${INV.map(([l,v])=>`<tr><td>${l}</td><td style="text-align:right">${fmt(v)}</td></tr>`).join("")}</table><p class="res">Celkem: ${fmt(invT)}</p></div>
<div class="card"><h3>Stálé měsíční náklady</h3><table>${FIXED.map(([l,v])=>`<tr><td>${l}</td><td style="text-align:right">${fmt(v)}</td></tr>`).join("")}</table><p class="res">Celkem: ${fmt(fixT)}</p></div>
<div class="card"><h3>Předpoklady a úvěr</h3><table><tr><td>Míst k sezení</td><td style="text-align:right">${M.seats}</td></tr><tr><td>Kolikrát se stůl za den vystřídá</td><td style="text-align:right">${M.turns}</td></tr><tr><td>Provozních dní / měsíc</td><td style="text-align:right">${M.days}</td></tr><tr><td>Průměrná útrata na hosta</td><td style="text-align:right">${fmt(M.price)}</td></tr><tr><td>Suroviny z tržeb</td><td style="text-align:right">${M.food*100} %</td></tr><tr><td>Úvěr (100 % investice)</td><td style="text-align:right">${fmt(P)}</td></tr><tr><td>Sazba / splatnost</td><td style="text-align:right">${M.rate*100} % / ${M.years} let</td></tr></table><p class="res">Splátka: ${fmt(pay)} / měs</p></div></div>
<div class="card"><h3>Scénáře (měsíčně)</h3><table><tr><th></th>${scen.map(s=>`<th>${s.name} (${Math.round(s.occ*100)} %)</th>`).join("")}</tr>
<tr><td>Hostů</td>${scen.map(s=>`<td>${num(s.g)}</td>`).join("")}</tr>
<tr><td>Tržby</td>${scen.map(s=>`<td>${fmt(s.rev)}</td>`).join("")}</tr>
<tr><td>Zbývá po odečtení surovin</td>${scen.map(s=>`<td>${fmt(s.gm)}</td>`).join("")}</tr>
<tr><td><b>Zisk po splátce</b> (před daní)</td>${scen.map(s=>`<td class="${s.profit>=0?"pos":"neg"}"><b>${fmt(s.profit)}</b></td>`).join("")}</tr></table>
<p class="small">Hostů k vyrovnání nákladů a splátky: asi ${num(be)} za měsíc. V pesimistickém scénáři provoz splátku nepokryje.</p></div>`;
V.mkt=`<h2>Marketingový plán</h2>${cards(MKT)}`;
V.prov=`<h2>Provoz a menu</h2>${cards(PROV)}`;
V.pravo=`<h2>Právo, daně, povolení</h2><div class="note">Nejsem právník ani účetní. Vše si před rozhodnutím ověřte s účetní, daňovým poradcem a na úřadech.</div>${cards(LAW)}`;
const tot=ROAD.reduce((a,p)=>a+p[1].length,0), dn=ROAD.reduce((a,p)=>a+p[1].filter(x=>x[1]==="done").length,0), pct=Math.round(100*dn/tot);
const ST={done:"✅",doing:"🔥",todo:"⬜"};
V.road=`<h2>Roadmapa</h2><div class="bar"><i style="--w:${pct}%"></i></div><p class="small">Splněno ${dn} z ${tot} (${pct} %). Stav aktualizuje Claude.</p>${ROAD.map(([t,it])=>`<div class="card" style="margin-bottom:14px"><h3>${t}</h3>${it.map(([x,s])=>`<label class="chk ${s==="done"?"done":""}"><span style="width:22px">${ST[s]}</span><span>${x}</span></label>`).join("")}</div>`).join("")}`;
V.otazky=`<h2>Otevřené otázky</h2><div class="grid">${ASK.map(([t,l])=>`<div class="card"><h3>${t}</h3><ul>${l.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;

// nav + tabs
const nav=$("#nav"),main=$("#main");$("#upd").textContent=UPDATED;
function show(id){main.innerHTML=`<section class="on">${V[id]}</section>`;nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
 const rp=$("#rp");if(rp)rp.textContent=dn+" / "+tot;
 requestAnimationFrame(()=>document.querySelectorAll(".bar i").forEach(i=>i.style.width=getComputedStyle(i).getPropertyValue("--w")));
 try{location.hash=id}catch(e){}window.scrollTo({top:0,behavior:"smooth"})}
TABS.forEach(([id,t])=>{const b=document.createElement("button");b.textContent=t;b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
const h=(location.hash||"").slice(1);show(TABS.some(t=>t[0]===h)?h:"prehled");
window.addEventListener("hashchange",()=>{const x=location.hash.slice(1);if(TABS.some(t=>t[0]===x))show(x)});

// spotlight na kartách
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".card");if(c){const b=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-b.left)+"px");c.style.setProperty("--my",(e.clientY-b.top)+"px")}});

// žhavé uhlíky
(function(){const cv=$("#fx"),x=cv.getContext("2d");let W,H,D=Math.min(devicePixelRatio||1,2),ps=[],mx=-1,my=-1;
 function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cv.style.width=W+"px";cv.style.height=H+"px";x.setTransform(D,0,0,D,0,0)}
 addEventListener("resize",rs);rs();addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY});
 const N=Math.round(Math.min(130,W/9));
 function mk(init){return{x:Math.random()*W,y:init?Math.random()*H:H+10,s:Math.random()*2.4+.6,v:Math.random()*.9+.35,sw:Math.random()*Math.PI*2,sa:Math.random()*.9+.2,l:Math.random(),h:Math.random()*35+8}}
 for(let i=0;i<N;i++)ps.push(mk(true));
 function f(){x.clearRect(0,0,W,H);for(const p of ps){p.y-=p.v*(1+(H-p.y)/H*.6);p.sw+=.02;p.x+=Math.sin(p.sw)*p.sa;
  if(mx>0){const dx=p.x-mx,dy=p.y-my,d=dx*dx+dy*dy;if(d<14000){p.x+=dx/Math.sqrt(d+1)*1.4;p.y+=dy/Math.sqrt(d+1)*.8}}
  const a=Math.max(0,Math.min(1,(p.y/H)*1.25));
  const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*5);g.addColorStop(0,`hsla(${p.h+20},100%,70%,${a})`);g.addColorStop(.4,`hsla(${p.h},100%,55%,${a*.55})`);g.addColorStop(1,`hsla(${p.h-8},100%,40%,0)`);
  x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.s*5,0,6.283);x.fill();
  if(p.y<-10||p.x<-20||p.x>W+20)Object.assign(p,mk(false))}
  requestAnimationFrame(f)}
 f()})();
</script>
</body>
</html>
